
services:
  toolbox:
    build:
      context: .
      dockerfile: images/Dockerfile.base
      args:
        RELEASE: latest
    image: fedora-dev-toolbox:latest
    container_name: fedora-dev-toolbox
    stdin_open: true
    tty: true
    volumes:
      - $HOME/Projects:/projects:rw
      - "$HOME/Library/Application Support/Viscosity/OpenVPN:/vpn-configs:ro"
      - $HOME/.local/share/containers/podman/machine/podman.sock:/run/podman/podman.sock:rw
    working_dir: /projects/fedora-dev-box
    command: /bin/bash
    environment:
      - ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
      - TERM=xterm-256color
    networks:
      - sonar-network

  postgres:
    image: postgres:15-alpine
    container_name: sonarqube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sonar-network

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - sonar-network

networks:
  sonar-network:
    driver: bridge

volumes:
  sonarqube_postgresql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
