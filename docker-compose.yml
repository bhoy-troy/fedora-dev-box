

x-s3-env: &s3-env
  FLOCI_HOSTNAME: devbox-s3
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-aws-access-key-id}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-aws-secret-access-key}

services:
  toolbox:
    build:
      context: .
      dockerfile: images/Dockerfile.base
      args:
        RELEASE: latest
    image: fedora-dev-toolbox:latest
    container_name: fedora-dev-toolbox
    hostname:   fedora-dev-toolbox
    stdin_open: true
    tty: true
    volumes:
      - $HOME/Projects:/projects:rw
      - "$HOME/Library/Application Support/Viscosity/OpenVPN:/vpn-configs:ro"
#      - $HOME/.local/share/containers/podman/machine/podman.sock:/run/podman/podman.sock:rw
    working_dir: /projects/fedora-dev-box
    command: /bin/bash
    environment:
      - ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
      - TERM=xterm-256color
    networks:
      - sonar-network

  postgres:
    image: postgres:15-alpine
    container_name: devbox-postgres
    hostname: devbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonarqube_postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sonar-network

  sonarqube:
    image: sonarqube:community
    container_name: devbox-sonarqube
    hostname: devbox-sonarqube
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - sonar-network

  fedora-notebook:
    build:
      context: .
      dockerfile: images/Dockerfile.jupyter
      args:
        - BASE_IMAGE=${BASE_IMAGE:-fedora-dev-toolbox:latest}
    image: fedora-notebook:latest
    container_name: devbox-notebook
    hostname: devbox-notebook
    working_dir: /workspace/Projects

    volumes:
      - ./dnf-cache-dnf5:/dnf_cachedir
      - ../:/workspace/Projects:z
      - ~/.ssh:/home/jupyter/.ssh:z
      - $HOME/Projects:/projects:rw

    ports:
      - "8888:8888"

    cap_add:
      - CAP_SYS_CHROOT

    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
      - ANSIBLE_VAULT_PASSWORD_FILE=.vault_pass
      # Auth disabled — no token needed for local dev
      # - JUPYTER_TOKEN=${JUPYTER_TOKEN:-dev-notebook-token}

    security_opt:
      - label=disable
networks:
  sonar-network:
    driver: bridge

volumes:
  sonarqube_postgresql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
